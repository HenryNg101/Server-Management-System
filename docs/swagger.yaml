basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: admin@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  model.Membership:
    properties:
      server:
        $ref: '#/definitions/model.Server'
      serverID:
        type: integer
      user:
        $ref: '#/definitions/model.User'
      userID:
        type: integer
      userRole:
        type: string
    type: object
  model.Server:
    properties:
      createdAt:
        description: Automatically managed by GORM for creation time
        type: string
      id:
        type: integer
      ipv4Address:
        description: IPv4 of the server
        type: string
      lastUpdated:
        description: Last time the server got updated
        type: string
      memberships:
        description: Manage many-to-many relationship between servers and users
        items:
          $ref: '#/definitions/model.Membership'
        type: array
      name:
        type: string
      port:
        description: Port of the server
        type: integer
      protocol:
        description: Network protocol that the server use, could be TCP, FTP, SSH,
          etc.
        type: string
      status:
        description: Server status at the time (Is it on or off)
        type: boolean
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      memberships:
        description: Manage many-to-many relationship between servers and users
        items:
          $ref: '#/definitions/model.Membership'
        type: array
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
    type: object
  model.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  server.CreateServerRequest:
    properties:
      ipv4_address:
        type: string
      name:
        type: string
      port:
        type: integer
      protocol:
        type: string
      status:
        type: boolean
    required:
    - ipv4_address
    - name
    - port
    - status
    type: object
  server.GetServerResponse:
    properties:
      created_at:
        description: Automatically managed by GORM for creation time
        type: string
      ipv4_address:
        description: IPv4 of the server
        type: string
      last_updated:
        description: Last time the server got updated
        type: string
      name:
        type: string
      port:
        description: Port of the server
        type: integer
      protocol:
        description: Network protocol that the server use, could be TCP, FTP, SSH,
          etc.
        type: string
      status:
        description: Server status at the time (Is it on or off)
        type: boolean
    type: object
  server.ImportFailure:
    properties:
      error:
        type: string
      record:
        additionalProperties:
          type: string
        type: object
      row:
        type: integer
    type: object
  server.ImportServersResponse:
    properties:
      failed_count:
        type: integer
      failures:
        items:
          $ref: '#/definitions/server.ImportFailure'
        type: array
      success_count:
        type: integer
      successes:
        items:
          $ref: '#/definitions/model.Server'
        type: array
    type: object
  server.Report:
    properties:
      servers_down:
        type: integer
      servers_up:
        type: integer
      total_servers:
        type: integer
      uptime_per_server:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  server.SendReportRequest:
    properties:
      count:
        description: The number of top N worst servers you want to show in the report
        type: integer
      emails:
        description: Optional. It might sends emails or nah
        items:
          type: string
        type: array
      end:
        type: string
      start:
        type: string
    required:
    - end
    - start
    type: object
  server.UpdateServerRequest:
    properties:
      ipv4:
        type: string
      name:
        type: string
      port:
        type: integer
      protocol:
        type: string
      status:
        type: boolean
    type: object
  user.GetUsersResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing servers and users, and reporting
  title: Server Management API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/json
      description: Invalidate refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /refresh:
    post:
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshResponse'
      summary: Refresh token
      tags:
      - auth
  /servers:
    get:
      description: Retrieve servers with filtering, pagination, and sorting
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: boolean
      - description: Filter by protocol
        in: query
        name: protocol
        type: string
      - description: Search by name
        in: query
        name: name
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 100)
        in: query
        name: page_size
        type: integer
      - description: Sort by field (id, name, created_at)
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.GetServerResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Get servers
      tags:
      - servers
    post:
      consumes:
      - application/json
      description: Create a new server, with specifications
      parameters:
      - description: Server payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateServerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Server'
      security:
      - BearerAuth: []
      summary: Create a server
      tags:
      - servers
  /servers/{id}:
    delete:
      description: Get a server based on ID, and delete that server
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a server
      tags:
      - servers
    get:
      description: Retrieve a server based on ID
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.GetServerResponse'
      security:
      - BearerAuth: []
      summary: Get a server
      tags:
      - servers
    patch:
      consumes:
      - application/json
      description: Get a server based on ID, and then update field(s)
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      - description: New server info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateServerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Server'
      security:
      - BearerAuth: []
      summary: Update a server
      tags:
      - servers
  /servers/export:
    get:
      description: User ask for all servers info with optional filtering, pagination,
        and sorting, and the server will export servers info to CSV file
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: boolean
      - description: Filter by protocol
        in: query
        name: protocol
        type: string
      - description: Search by name
        in: query
        name: name
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 100)
        in: query
        name: page_size
        type: integer
      - description: Sort by field (id, name, created_at)
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV file
          headers:
            Content-Disposition:
              description: attachment; filename=servers.csv
              type: string
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export servers info to csv file
      tags:
      - servers
  /servers/import:
    post:
      consumes:
      - multipart/form-data
      description: User uploads an Excel file with servers info, and the server will
        try to import valid servers
      parameters:
      - description: Input servers file (CSV)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ImportServersResponse'
      security:
      - BearerAuth: []
      summary: Import servers from csv file
      tags:
      - servers
  /servers/report:
    post:
      description: Get status report on the servers, and then send emails to people
        in the email list
      parameters:
      - description: Report request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.SendReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.Report'
      security:
      - BearerAuth: []
      summary: Get statuses of servers and emailing
      tags:
      - servers
  /users:
    get:
      description: Retrieve list of users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.GetUsersResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - users
    post:
      description: Create a new user, with specifications
      parameters:
      - description: User to be created
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer ' followed by your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
