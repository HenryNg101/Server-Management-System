basePath: /agents
definitions:
  agent.MetricMessage:
    properties:
      '@timestamp':
        type: string
      container_name:
        type: string
      cpu:
        properties:
          pressure:
            type: number
          throttling:
            type: number
          usage:
            type: number
        type: object
      io:
        properties:
          pressure:
            type: number
          read_bps:
            type: number
          write_bps:
            type: number
        type: object
      memory:
        properties:
          pressure:
            type: number
          rss:
            type: number
          usage:
            type: number
          working_set:
            type: number
        type: object
      oom:
        properties:
          events:
            type: integer
          kills:
            type: integer
        type: object
      pids:
        type: integer
      server_id:
        type: integer
    type: object
  agent.RegisterAgentRequest:
    properties:
      hostname:
        type: string
      instance_id:
        type: string
      server_name:
        type: string
    required:
    - hostname
    - instance_id
    - server_name
    type: object
  agent.RegisterAgentResponse:
    properties:
      agent_id:
        type: integer
      api_key:
        type: string
      server_id:
        type: integer
    type: object
host: localhost
info:
  contact: {}
  description: APIs for agents to push data to system
  title: Agent Service API
  version: "1.0"
paths:
  /metrics:
    post:
      consumes:
      - application/json
      description: Ingest metrics from agent upload
      parameters:
      - description: Server's metrics
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/agent.MetricMessage'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Metrics
      tags:
      - agents
  /register:
    post:
      consumes:
      - application/json
      description: Register an agent instance to an existing server owned by the authenticated
        user
      parameters:
      - description: Agent registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.RegisterAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agent.RegisterAgentResponse'
        "400":
          description: Bad request / validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new agent
      tags:
      - agents
  /rotate-key:
    post:
      description: Rotate API key for the authenticated agent. The old key will be
        invalidated immediately.
      produces:
      - application/json
      responses:
        "200":
          description: New API key
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - invalid or missing API key
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Rotate agent API key
      tags:
      - agents
securityDefinitions:
  ApiKeyAuth:
    description: API Key for external automated systems.
    in: header
    name: X-Agent-API-Key
    type: apiKey
swagger: "2.0"
