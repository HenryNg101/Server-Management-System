# Using anchors and aliases to have a common config for multiple services (DRY principle)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-dependency: &common-dependency
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/api
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging

  servers_checker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/servers_checker
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  emailer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/emailer
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging

  # Elasticsearch and Kibana setup
  # This current Elasticsearch setup is for local testing only with a single node Elasticsearch cluster, and Kibana dashboard
  # It based on a very minimal setup, with no TLS or HTTPS whatsoever: https://www.elastic.co/docs/deploy-manage/security/set-up-minimal-security
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.3.1
    restart: always
    env_file:
      - .env.docker
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u ${ELASTIC_USER}:${ELASTIC_PASSWORD} http://localhost:${ELASTIC_PORT}/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    logging: *default-logging

  # Run some commands after Elasticsearch cluster is up. Basically check until service is available to take a HTTP request, 
  # then make a request to change password for ES's service account for Kibana
  elasticsearch-setup:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/elasticsearch/setup.sh"]
    volumes:
      - ./scripts:/scripts
    env_file:
      - .env.docker
    restart: no
    logging: *default-logging

  kibana:
    image: docker.elastic.co/kibana/kibana-wolfi:9.3.1
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTIC_HOST}:${ELASTIC_PORT}
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"
    logging: *default-logging
  
  # PostgreSQL DB setup
  postgres:
    image: postgres:latest
    container_name: sqldb
    restart: always
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Postgres schema migration
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env.docker
    command: [
      "-path", "/migrations",
      "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable",
      "up"
    ]
    logging: *default-logging
  
  # Redis setup
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: always
    env_file:
      - .env.docker
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  es_data:
  postgres_data:
  redis_data: