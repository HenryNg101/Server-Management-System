# Using anchors and aliases to have a common config for multiple services (DRY principle)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-dependency: &common-dependency
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  kafka:
    condition: service_started
  postgres-migrate:
    condition: service_completed_successfully
  kafka-setup:
    condition: service_completed_successfully

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/api
    ports:
      - "${HOST}:8080:8080"
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - ${ENV_FILE}
    environment:
      - APP_ENV=docker
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  servers_checker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/servers_checker
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - ${ENV_FILE}
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  cron_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/cron_scheduler
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - ${ENV_FILE}
    environment:
      - APP_ENV=docker
    logging: *default-logging

  metrics_consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/metrics_consumer
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - ${ENV_FILE}
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  file_importer_consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/file_importer_consumer
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - ${ENV_FILE}
    environment:
      - APP_ENV=docker
    logging: *default-logging

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
    environment:
      - APP_ENV=docker
      - PORT=8081
    logging: *default-logging

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/users`)"
      - "traefik.http.services.user.loadbalancer.server.port=8082"
      - "traefik.http.middlewares.user-strip.stripprefix.prefixes=/users"
      - "traefik.http.routers.user.middlewares=user-strip"
    environment:
      - APP_ENV=docker
      - PORT=8082
    logging: *default-logging

  server-service:
    build:
      context: ./services/server-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servers.rule=PathPrefix(`/servers`)"
      - "traefik.http.services.servers.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.servers-strip.stripprefix.prefixes=/servers"
      - "traefik.http.routers.servers.middlewares=servers-strip"
    environment:
      - APP_ENV=docker
      - PORT=8083
    logging: *default-logging

  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8088:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock