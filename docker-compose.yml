# Using anchors and aliases to have a common config for multiple services (DRY principle)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-dependency: &common-dependency
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  kafka:
    condition: service_started
  postgres-migrate:
    condition: service_completed_successfully
  kafka-setup:
    condition: service_completed_successfully

