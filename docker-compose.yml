# Using anchors and aliases to have a common config for multiple services (DRY principle)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-dependency: &common-dependency
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/api
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging

  servers_checker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/servers_checker
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  emailer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/worker/emailer
    restart: unless-stopped
    depends_on: *common-dependency
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging