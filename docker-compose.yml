# Using anchors and aliases to have a common config for multiple services (DRY principle)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file:
    - .env.docker
  environment:
    - APP_ENV=docker
  logging: *default-logging
  networks:
    - app-network

services:
  auth-service:
    <<: *service-defaults
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app-network"

      # SERVICE PORT
      - "traefik.http.services.auth.loadbalancer.server.port=8087"

      # ========================
      # MIDDLEWARES
      # ========================

      # Strip /auth prefix
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"

      # Strict API rate limit
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.burst=20"

      # Relaxed Swagger rate limit
      - "traefik.http.middlewares.auth-swagger-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.auth-swagger-ratelimit.ratelimit.burst=100"

      # ========================
      # ROUTERS
      # ========================

      # Rules for API routes (exclude swagger)
      - "traefik.http.routers.auth-api.rule=PathPrefix(`/auth`) && !PathPrefix(`/auth/swagger`)"
      - "traefik.http.routers.auth-api.entrypoints=web"
      - "traefik.http.routers.auth-api.middlewares=auth-strip,auth-ratelimit"
      - "traefik.http.routers.auth-api.service=auth"

      # Rules for Swagger routes. Still the same, different rate limiting
      - "traefik.http.routers.auth-swagger.rule=PathPrefix(`/auth/swagger`)"
      - "traefik.http.routers.auth-swagger.entrypoints=web"
      - "traefik.http.routers.auth-swagger.middlewares=auth-strip,auth-swagger-ratelimit"
      - "traefik.http.routers.auth-swagger.service=auth"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    
    # For Swarm mode later
    # image: server-management-system-auth-service:latest 
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

