  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
    environment:
      - APP_ENV=docker
      - PORT=8081
    logging: *default-logging

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/users`)"
      - "traefik.http.services.user.loadbalancer.server.port=8082"
      - "traefik.http.middlewares.user-strip.stripprefix.prefixes=/users"
      - "traefik.http.routers.user.middlewares=user-strip"
    environment:
      - APP_ENV=docker
      - PORT=8082
    logging: *default-logging

  server-service:
    build:
      context: ./services/server-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servers.rule=PathPrefix(`/servers`)"
      - "traefik.http.services.servers.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.servers-strip.stripprefix.prefixes=/servers"
      - "traefik.http.routers.servers.middlewares=servers-strip"
    environment:
      - APP_ENV=docker
      - PORT=8083
    logging: *default-logging

  monitoring-service:
    build:
      context: ./services/monitoring-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monitoring.rule=PathPrefix(`/monitoring`)"
      - "traefik.http.services.monitoring.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.monitoring-strip.stripprefix.prefixes=/monitoring"
      - "traefik.http.routers.monitoring.middlewares=monitoring-strip"
    environment:
      - APP_ENV=docker
      - PORT=8084
    logging: *default-logging

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/agent`)"
      - "traefik.http.services.agent.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.agent-strip.stripprefix.prefixes=/agent"
      - "traefik.http.routers.agent.middlewares=agent-strip"
    environment:
      - APP_ENV=docker
      - PORT=8085
    logging: *default-logging

  jobs-service:
    build:
      context: ./services/jobs-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.docker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobs.rule=PathPrefix(`/jobs`)"
      - "traefik.http.services.jobs.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.jobs-strip.stripprefix.prefixes=/jobs"
      - "traefik.http.routers.jobs.middlewares=jobs-strip"
    environment:
      - APP_ENV=docker
      - PORT=8086
    logging: *default-logging

  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8088:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  metrics-consumer:
    build:
      context: ./workers/metrics-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  files-import-consumer:
    build:
      context: ./workers/files-import-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  servers-ping-checker:
    build:
      context: ./workers/servers-ping-checker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging
  
  cron-scheduler:
    build:
      context: ./workers/cron-scheduler
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - APP_ENV=docker
    logging: *default-logging